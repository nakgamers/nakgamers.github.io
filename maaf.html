<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untukmu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine: #3b1220;
    --wine-deep: #2a0c15;
    --blush: #f3cdd2;
    --rose: #c9576a;
    --gold: #cda45e;
    --cream: #faf3e8;
    --paper: #fbf6ec;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--wine) 0%, var(--wine-deep) 70%);
    font-family: 'Cormorant Garamond', serif;
    overflow-x:hidden;
    color: var(--cream);
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    position:relative;
  }

  /* falling petals */
  .petals{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .petal{
    position:absolute;
    top:-5%;
    font-size: 14px;
    opacity:.55;
    color: var(--rose);
    animation: fall linear infinite;
    filter: drop-shadow(0 0 2px rgba(0,0,0,.2));
  }
  @keyframes fall{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.6; }
    100%{ transform: translateY(105vh) translateX(20px) rotate(200deg); opacity:0; }
  }

  .intro{
    text-align:center;
    z-index:2;
    margin-bottom: 46px;
  }
  .eyebrow{
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 14px;
    font-family: 'Cormorant Garamond', serif;
  }
  .intro h1{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: clamp(34px, 6vw, 56px);
    color: var(--blush);
    text-shadow: 0 2px 18px rgba(201,87,106,.35);
  }
  .intro p{
    margin-top:10px;
    font-size: 18px;
    color: var(--cream);
    opacity:.8;
    font-style: italic;
  }

  /* ENVELOPE */
  .stage{
    position:relative;
    width: min(92vw, 380px);
    height: 300px;
    z-index: 2;
    perspective: 1400px;
  }

  .envelope{
    position:absolute;
    inset:0;
    cursor:pointer;
  }

  .env-body{
    position:absolute;
    inset:0;
    background: linear-gradient(160deg, #f6e2c8, #ecd0ac);
    border-radius: 6px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
    overflow:hidden;
    z-index: 4;
  }

  .env-body::before{ /* left triangle shading */
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(115deg, rgba(0,0,0,.08) 0%, transparent 35%),
      linear-gradient(245deg, rgba(0,0,0,.08) 0%, transparent 35%);
  }

  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height: 130px;
    background: linear-gradient(160deg, #efd2ab, #e2b98a);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 0.85s cubic-bezier(.7,-0.4,.3,1.4);
    z-index: 5;
    box-shadow: 0 6px 14px rgba(0,0,0,.25);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .seal{
    position:absolute;
    top: 68px;
    left:50%;
    transform: translateX(-50%);
    width:48px; height:48px;
    background: radial-gradient(circle at 35% 30%, #d96a7a, #8f1f34 70%);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
    color: var(--cream);
    box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 2px 3px rgba(255,255,255,.25);
    z-index: 6;
    transition: opacity .3s ease .1s, transform .3s ease .1s;
  }

  .letter{
    position:absolute;
    left: 4%;
    right: 4%;
    bottom: 4%;
    top: 4%;
    background: var(--paper);
    border-radius: 8px;
    box-shadow: 0 20px 45px rgba(0,0,0,.45);
    opacity: 0;
    transform: translateY(4%) scale(.92);
    transition: opacity 0.6s ease .25s, transform 0.6s cubic-bezier(.16,.9,.3,1.1) .25s;
    z-index: 6;
    padding: clamp(14px,4vw,26px) clamp(12px,4vw,22px) 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color: #4a2530;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    pointer-events: none;
  }

  .letter .msg1{
    font-size: clamp(15px, 4.5vw, 21px);
    font-weight: 600;
    color: var(--wine-deep);
    line-height:1.35;
    margin-bottom: clamp(8px,3vw,14px);
    word-wrap: break-word;
  }

  .photo-frame{
    width: clamp(90px,26vw,128px);
    height: clamp(90px,26vw,128px);
    flex-shrink: 0;
    border-radius: 6px;
    background: linear-gradient(135deg, #f3d9dd, #e7b8c1);
    border: 6px solid #fff;
    box-shadow: 0 8px 18px rgba(0,0,0,.28);
    transform: rotate(-4deg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:4px;
    color: #a15064;
    font-size: 10px;
    line-height:1.3;
    margin-bottom: clamp(8px,3vw,14px);
    overflow:hidden;
    position:relative;
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover;
    display:none;
  }
  .photo-frame .placeholder-heart{ font-size:28px; }

  .letter .msg2{
    font-family:'Dancing Script', cursive;
    font-size: clamp(18px, 5vw, 24px);
    color: var(--rose);
    font-weight:700;
  }

  /* Open state */
  .stage.open .flap{
    transform: rotateX(180deg);
  }
  .stage.open .seal{
    opacity:0;
    transform: translateX(-50%) scale(.4);
  }
  .stage.open .env-body{
    opacity: 0;
    transition: opacity 0.4s ease .15s;
  }
  .stage.open .letter{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .hint{
    margin-top: 30px;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--blush);
    opacity:.65;
    z-index:2;
    text-align:center;
  }

  footer{
    margin-top: 40px;
    font-size: 13px;
    color: var(--gold);
    opacity:.55;
    z-index:2;
    text-align:center;
    font-style: italic;
  }

  @media (hover:hover){
    .stage:hover .flap{
      transform: rotateX(180deg);
    }
    .stage:hover .seal{
      opacity:0;
      transform: translateX(-50%) scale(.4);
    }
    .stage:hover .env-body{
      opacity: 0;
      transition: opacity 0.4s ease .15s;
    }
    .stage:hover .letter{
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
  }

  @media (max-width: 420px){
    .stage{ height: 280px; }
    .seal{ top: 60px; width:40px; height:40px; font-size:16px; }
    .flap{ height: 115px; }
  }

  @media (max-width: 340px){
    .stage{ height: 260px; }
  }
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div class="intro">
  <div class="eyebrow">Untuk seseorang yang berarti</div>
  <h1>Buka amplopnya, sayang</h1>
  <p>ada sesuatu yang ingin aku sampaikan</p>
</div>

<div class="stage" id="stage">
  <div class="envelope">
    <div class="env-body"></div>
    <div class="letter">
      <div class="msg1">Maaf karena terlalu buruk dalam menunjukan cinta</div>
      <div class="photo-frame">
        <!-- Ganti src di bawah dengan foto kebersamaan kalian, lalu hapus class "placeholder-heart" pada span -->
        <img src="https://nandz.my.id/assets/images/ig.png" alt="Foto kebersamaan">
        <span class="placeholder-heart">🤍</span>
        <span>letakkan foto kalian di sini</span>
      </div>
      <div class="msg2">Trying to better ✧</div>
    </div>
    <div class="flap"></div>
    <div class="seal">❤</div>
  </div>
</div>

<div class="hint">arahkan kursor / sentuh amplop untuk membukanya</div>
<footer>dengan sepenuh hati, selalu berusaha lebih baik untukmu</footer>

<script>
  // Falling petals background
  const petalWrap = document.getElementById('petals');
  const symbols = ['♥','❀','✿'];
  const count = 18;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className='petal';
    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    p.style.left = Math.random()*100+'vw';
    p.style.fontSize = (10+Math.random()*14)+'px';
    p.style.animationDuration = (9+Math.random()*10)+'s';
    p.style.animationDelay = (Math.random()*10)+'s';
    petalWrap.appendChild(p);
  }

  // Touch support: tap to toggle open (in addition to CSS hover for desktop)
  const stage = document.getElementById('stage');
  stage.addEventListener('click', () => {
    stage.classList.toggle('open');
  });

  // If an image actually loads successfully, hide the placeholder heart/text
  const img = document.querySelector('.photo-frame img');
  img.addEventListener('load', () => {
    img.style.display = 'block';
    document.querySelector('.placeholder-heart').style.display='none';
    img.nextElementSibling.nextElementSibling.style.display='none';
  });
</script>

</body>
</html>
